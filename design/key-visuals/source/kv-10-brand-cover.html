<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KV-10 Brand cover</title>
<link rel="stylesheet" href="kv.css">
<style>
  .kv { --w: 1080px; --h: 1080px; }
  .field { position: absolute; inset: 0; -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 0, #000 52%, transparent 88%); mask-image: radial-gradient(circle at 50% 42%, #000 0, #000 52%, transparent 88%); }
  .field canvas { width: 100%; height: 100%; display: block; }
  .mark { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); width: 300px; height: 300px; background: #0a0a0a; border: 1px solid rgba(255,255,255,.16); display: grid; place-items: center; }
  .mark img { width: 220px; height: 220px; display: block; }
  .top { position: absolute; left: 56px; right: 56px; top: 56px; display: flex; justify-content: space-between; align-items: center; }
  .bottom { position: absolute; left: 56px; right: 56px; bottom: 56px; display: flex; justify-content: space-between; align-items: flex-end; }
  .name { font-family: "Geist Mono"; font-size: 44px; letter-spacing: .22em; color: var(--zinc-50); }
  h2 { font-size: 64px; margin-top: 14px; }
  .addr { text-align: right; line-height: 1.8; }
  .rule { position: absolute; left: 56px; right: 56px; bottom: 262px; height: 1px; background: rgba(255,255,255,.08); }
</style>
</head>
<body>
<div class="kv dark">
  <div class="layer footer-dots" style="opacity:.6"></div>
  <div class="field"><canvas data-field='{"cols":36,"t":3.1,"seed":9,"base":"#1c1c20","dark":"#2a2a2f","accentRate":0.012,"alpha":1}'></canvas></div>

  <div class="top">
    <p class="tag muted">Mosaic Capital</p>
    <p class="tag muted">Robinhood Chain · USDG</p>
  </div>

  <div class="mark"><img class="knockout" src="mosaiclogo.jpg" alt=""></div>

  <div class="rule"></div>
  <div class="bottom">
    <div>
      <p class="name">Mosaic</p>
      <h2>One deposit.<br>Every yield.</h2>
    </div>
    <div class="addr">
      <p class="label">Vault</p>
      <p class="mono" style="font-size:16px;color:var(--zinc-300)">0xFB20…5A6f</p>
      <p class="label" style="margin-top:10px">ERC-4626 · verified</p>
    </div>
  </div>
</div>
<script src="kv.js"></script>
</body>
</html>
