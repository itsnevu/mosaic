<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KV-06 Mosaic field</title>
<link rel="stylesheet" href="kv.css">
<style>
  .kv { --w: 1080px; --h: 1080px; }
  .field { position: absolute; inset: 0; -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 12%, #000 66%, transparent 86%); mask-image: linear-gradient(180deg, transparent 0%, #000 12%, #000 66%, transparent 86%); }
  .field canvas { width: 100%; height: 100%; display: block; }
  .plate { position: absolute; left: 50%; top: 50%; width: 300px; height: 300px; transform: translate(-50%, -56%); background: #fff; border: 1px solid var(--line-strong); display: grid; place-items: center; box-shadow: var(--lift-2); }
  .plate img { width: 220px; height: 220px; display: block; }
  .bottom { position: absolute; left: 56px; right: 56px; bottom: 56px; display: flex; justify-content: space-between; align-items: flex-end; }
  h2 { font-size: 72px; margin-top: 18px; }
  .top { position: absolute; left: 56px; right: 56px; top: 56px; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div class="kv">
  <div class="field"><canvas data-field='{"cols":40,"t":1.2,"seed":21,"accentRate":0.01,"alpha":0.9}'></canvas></div>
  <div class="top">
    <div class="wordmark"><img src="mosaiclogo.jpg" width="28" height="28" alt=""><span>Mosaic</span></div>
    <p class="tag muted">[10] Close</p>
  </div>
  <div class="plate"><img src="mosaiclogo.jpg" alt=""></div>
  <div class="bottom">
    <div>
      <p class="tag">Mosaic Capital</p>
      <h2>Many fragments.<br>One picture.</h2>
    </div>
    <p class="label" style="text-align:right;line-height:1.7">One deposit.<br>Many sources of yield.<br>Zero monitoring.</p>
  </div>
</div>
<script src="kv.js"></script>
</body>
</html>
